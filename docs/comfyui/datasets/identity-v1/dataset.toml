# kohya-ss/sd-scripts FLUX dataset config for identity-v1
# On the rented box, kohya-flux-48gb.sh rewrites image_dir to the absolute path.

[general]
shuffle_caption = false
keep_tokens = 1
caption_extension = ".txt"

[[datasets]]
resolution = 1024
batch_size = 1
enable_bucket = true
bucket_no_upscale = true
min_bucket_reso = 640
max_bucket_reso = 1280
bucket_reso_steps = 64

  [[datasets.subsets]]
  image_dir = "./images"
  num_repeats = 10
